<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kambing Interaktif — Tugas Sistem Multimedia</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#f6f3ec;color:#2b2b2b;padding:24px 16px 48px}
  .wrap{max-width:920px;margin:0 auto}
  header{text-align:center;margin-bottom:20px}
  h1{font-size:32px;letter-spacing:-.5px}
  header p{color:#6b7280;margin-top:6px}
  .pill{display:inline-block;background:#e4efe3;color:#3f6b3a;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;margin-top:12px}
  .stage{position:relative;width:100%;aspect-ratio:16/9;border-radius:24px;overflow:hidden;background:#dfe9dc url("assets/bg-meadow.jpg") center/cover no-repeat;box-shadow:0 12px 32px rgba(0,0,0,.12)}
  #goat{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);height:62%;width:auto;cursor:pointer}
  #goat.idle{animation:bob 2.4s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-6px)}}
  #stageVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
  .status{text-align:center;margin:14px 0 4px;font-size:18px;font-weight:600;min-height:26px}
  .hint{text-align:center;color:#6b7280;font-size:14px;margin-bottom:16px}
  .controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:28px}
  button{border:0;border-radius:999px;padding:12px 20px;font-size:15px;font-weight:600;cursor:pointer;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.08)}
  button:hover{background:#eef4ec}
  button.primary{background:#3f6b3a;color:#fff}
  button.primary:hover{background:#34582f}
  .motion{display:flex;justify-content:space-around;align-items:flex-end;gap:8px;margin-top:8px;overflow:hidden;padding:8px 0 0}
  .motion img{height:150px;width:auto}
  .motion .m-walk{animation:slide 3.2s ease-in-out infinite alternate}
  .motion .m-jump{animation:bounce 1.4s ease-in-out infinite}
  .motion .m-eat{animation:nibble 2.2s ease-in-out infinite}
  .motion .m-idle{animation:floaty 2.8s ease-in-out infinite}
  @keyframes slide{from{transform:translateX(-18px)}to{transform:translateX(18px)}}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-34px)}}
  @keyframes nibble{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-4deg) translateY(4px)}}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @media(max-width:640px){h1{font-size:26px}#goat{height:58%}.motion img{height:96px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Kambing Interaktif</h1>
    <p>Tugas Sistem Multimedia &middot; Visual &bull; Audio &bull; Animasi</p>
    <p>Muhamad Yusuf &middot; 242502040108</p>
    <span class="pill">Klik kambingnya, atau pakai tombol di bawah</span>
  </header>

  <div class="stage" id="stage">
    <video id="stageVideo" muted playsinline preload="metadata"></video>
    <img id="goat" class="idle" src="assets/goat-idle.png" alt="Kambing">
  </div>
  <div class="status" id="status">Kambing sedang berdiri di padang.</div>
  <div class="hint">Klik kambing = lompat + mengembik</div>

  <div class="controls">
    <button onclick="doAction('idle')">Berdiri</button>
    <button onclick="doAction('walk')">Jalan</button>
    <button onclick="doAction('eat')">Makan Rumput</button>
    <button onclick="doAction('jump')">Lompat</button>
    <button class="primary" onclick="playBleat()">Suara: Mbek!</button>
  </div>

  <div class="motion">
    <img class="m-walk" src="assets/goat-walk.png" alt="">
    <img class="m-jump" src="assets/goat-jump.png" alt="">
    <img class="m-eat" src="assets/goat-eat.png" alt="">
    <img class="m-idle" src="assets/goat-idle.png" alt="">
  </div>
</div>

<audio id="bleat" preload="auto" src="https://upload.wikimedia.org/wikipedia/commons/transcoded/b/bc/Herd_of_goats_bleating.ogg/Herd_of_goats_bleating.ogg.mp3"></audio>
<script>
  const goat = document.getElementById('goat');
  const stageVideo = document.getElementById('stageVideo');
  const statusEl = document.getElementById('status');
  const bleat = document.getElementById('bleat');
  let busy = false, segEnd = null, segText = '', bleatTimer = null;

  function playBleat() {
    try {
      bleat.currentTime = 0;
      bleat.play();
      clearTimeout(bleatTimer);
      bleatTimer = setTimeout(() => bleat.pause(), 4000);
    } catch (e) {}
  }

  function showGoatIdle(text) {
    stageVideo.pause();
    stageVideo.style.display = 'none';
    goat.style.display = 'block';
    goat.src = 'assets/goat-idle.png';
    goat.className = 'idle';
    statusEl.textContent = text;
  }

  function playVideo(src, start, end, text) {
    busy = true;
    segEnd = end;
    segText = text;
    goat.style.display = 'none';
    stageVideo.style.display = 'block';
    stageVideo.muted = true;
    if (stageVideo.getAttribute('src') !== src) stageVideo.setAttribute('src', src);
    const startPlay = () => {
      stageVideo.currentTime = start;
      stageVideo.play().catch(() => { busy = false; showGoatIdle(text); });
    };
    if (stageVideo.readyState >= 1) startPlay();
    else stageVideo.addEventListener('loadedmetadata', startPlay, { once: true });
  }

  stageVideo.addEventListener('timeupdate', () => {
    if (segEnd !== null && stageVideo.currentTime >= segEnd) {
      segEnd = null;
      busy = false;
      showGoatIdle(segText);
    }
  });
  stageVideo.addEventListener('ended', () => {
    if (segEnd !== null) { segEnd = null; busy = false; showGoatIdle(segText); }
  });

  function doAction(action) {
    if (action === 'idle') {
      segEnd = null;
      busy = false;
      showGoatIdle('Kambing sedang berdiri di padang.');
      return;
    }
    if (busy) return;
    if (action === 'walk') {
      statusEl.textContent = 'Kambing sedang berjalan menyusuri padang...';
      playVideo('assets/goat-walk-video.mp4', 0, 10, 'Kambing sudah sampai, lalu berdiri lagi.');
    } else if (action === 'eat') {
      statusEl.textContent = 'Kambing sedang makan rumput...';
      playVideo('assets/goat-eat-video.mp4', 0, 10, 'Kambing selesai makan, lalu berdiri lagi.');
    } else if (action === 'jump') {
      statusEl.textContent = 'Kambing melompat!';
      playBleat();
      playVideo('assets/goat-jump-video.mp4', 2.0, 7.0, 'Kambing mendarat, lalu berdiri lagi.');
    }
  }
  goat.addEventListener('click', () => doAction('jump'));
</script>
</body>
</html>
